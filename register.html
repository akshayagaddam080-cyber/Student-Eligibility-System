<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>Student Eligibility System</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="students.html">Students</a>
            <a href="eligibility.html">Eligibility</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1>Student Registration</h1>

        <form id="studentForm">

            <h3>Personal Details</h3>

            <label>Student ID</label>
            <input type="text" id="studentId" required>

            <label>Student Name</label>
            <input type="text" id="studentName" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <h3>Contact Details</h3>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Phone</label>
            <input type="tel" id="phone" required>

            <label>Address</label>
            <textarea id="address"></textarea>

            <label>City</label>
            <input type="text" id="city">

            <label>State</label>
            <input type="text" id="state">

            <h3>Academic Details</h3>

            <label>Roll Number</label>
            <input type="text" id="rollNumber" required>

            <label>Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>IT</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>AI & ML</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <label>Course</label>
            <input type="text" id="course" placeholder="Example: B.Tech">

            <label>Year</label>
            <select id="year">
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <label>Semester</label>
            <select id="semester">
                <option value="">Select Semester</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
            </select>

            <label>College</label>
            <input type="text" id="college">

            <label>University</label>
            <input type="text" id="university">

            <h3>Previous Academic Details</h3>

            <label>10th Percentage</label>
            <input type="number" id="tenth" min="0" max="100" step="0.01" required>

            <label>12th / Diploma Percentage</label>
            <input type="number" id="twelfth" min="0" max="100" step="0.01">

            <h3>Current Academic Details</h3>

            <label>CGPA</label>
            <input type="number" id="cgpa" min="0" max="10" step="0.01" required>

            <label>Attendance (%)</label>
            <input type="number" id="attendance" min="0" max="100" step="0.01" required>

            <label>Total Backlogs</label>
            <input type="number" id="backlogs" min="0" required>

            <label>Active Backlogs</label>
            <input type="number" id="activeBacklogs" min="0" required>

            <h3>Additional Details</h3>

            <label>Skills</label>
            <textarea id="skills" placeholder="Example: Java, Python, HTML"></textarea>

            <label>Certifications</label>
            <textarea id="certifications"></textarea>

            <label>Projects</label>
            <textarea id="projects"></textarea>

            <label>Internship</label>
            <select id="internship">
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>

            <button type="submit" class="submit-btn">Save Student</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
